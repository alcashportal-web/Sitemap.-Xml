<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>The Educator - Professional School Management</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            min-height: 650px;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6e 100%);
            color: white;
            padding: 20px 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .header h1 i { margin-right: 8px; color: #ffd700; animation: pulse 2s infinite; }
        .header p { font-size: 0.7rem; opacity: 0.85; margin-top: 4px; }
        .user-badge {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 8px;
        }
        .content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f8fafc;
            max-height: 65vh;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eef2ff;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 0.4s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }
        .form-group { margin-bottom: 12px; }
        label { font-weight: 600; font-size: 0.7rem; color: #475569; display: block; margin-bottom: 4px; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 24px;
            font-size: 0.8rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        button {
            background: linear-gradient(135deg, #3b82f6 0%, #1e3a5f 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            width: 100%;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.97); }
        button.secondary { background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; }
        button.danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        button.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        button.warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .btn-sm { width: auto; padding: 6px 12px; font-size: 0.7rem; display: inline-block; margin: 4px; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 40px;
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px 6px;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            transition: 0.2s;
            color: #64748b;
        }
        .nav-tab i { display: block; font-size: 1.1rem; margin-bottom: 4px; }
        .nav-tab.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1e3a5f 100%);
            color: white;
        }
        .role-buttons { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .role-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .role-btn.active { background: linear-gradient(135deg, #3b82f6 0%, #1e3a5f 100%); color: white; }
        .item-card {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            border-left: 4px solid #3b82f6;
            transition: 0.2s;
        }
        .item-card:hover { background: #eef2ff; }
        .badge {
            background: #dbeafe;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            margin: 4px 4px 0 0;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fed7aa; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }
        .stat-number { font-size: 1.5rem; font-weight: 800; color: #1e3a5f; }
        .message {
            background: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 12px;
            border-left: 4px solid #10b981;
            animation: slideDown 0.3s ease;
        }
        .error { background: #fee2e2; color: #991b1b; border-left-color: #ef4444; }
        .file-upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
            background: #faf5ff;
        }
        .file-upload-area:hover { background: #f3e8ff; border-color: #3b82f6; }
        .attendance-table { width: 100%; border-collapse: collapse; }
        .attendance-table th, .attendance-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .attendance-btn { width: 40px; padding: 6px; margin: 0 4px; display: inline-block; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: #3b82f6; border-radius: 10px; transition: width 0.5s; }
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 16px;
            margin-bottom: 8px;
            transition: 0.2s;
        }
        .task-item:hover { background: #eef2ff; }
        .task-done { text-decoration: line-through; opacity: 0.6; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @media (max-width: 480px) {
            .app-container { border-radius: 32px; }
            .nav-tab { font-size: 0.6rem; }
            .nav-tab i { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header" id="logoClickArea">
        <h1><i class="fas fa-graduation-cap"></i> The Educator</h1>
        <p>Complete School Management System</p>
        <div id="userInfoDisplay" class="user-badge"><i class="fas fa-user-circle"></i> Not Logged In</div>
    </div>
    <div class="content" id="mainContent"></div>
</div>

<script>
    // ======================== DATA ========================
    let schools = [{ id: "school1", name: "The Educator", code: "EDU001" }];
    let admins = [{ id: "admin1", username: "admin", password: "admin123", schoolId: "school1", name: "School Admin" }];
    let teachers = [{ id: "t1", name: "Mr. David Miller", email: "teacher@demo.com", password: "teacher123", schoolId: "school1" }];
    let students = [
        { id: "s1", name: "Emma Watson", rollNumber: "S101", password: "student123", className: "10th A", schoolId: "school1", attendance: {}, fines: [], tasks: [] },
        { id: "s2", name: "James Wilson", rollNumber: "S102", password: "student123", className: "10th A", schoolId: "school1", attendance: {}, fines: [], tasks: [] },
        { id: "s3", name: "Sophia Lee", rollNumber: "S201", password: "student123", className: "9th A", schoolId: "school1", attendance: {}, fines: [], tasks: [] }
    ];
    let classesList = [{ id: "c1", name: "10th A", schoolId: "school1" }, { id: "c2", name: "9th A", schoolId: "school1" }];
    let homeworks = [
        { id: "hw1", className: "10th A", subject: "Mathematics", description: "Solve Ex 5.1", dueDate: "2026-04-25", teacherId: "t1", schoolId: "school1", completedBy: [] }
    ];
    let events = [{ id: "e1", title: "Final Exams", date: "2026-05-10", type: "exam", schoolId: "school1" }];
    let fines = [{ id: "f1", studentId: "s1", amount: 500, reason: "Library fine", paid: false, schoolId: "school1" }];
    let paymentInfo = { jazzcash: "03001234567", easypaisa: "03111234567", bank: "HBL A/C 1234-5678" };
    let chats = [];
    let attendanceRecords = [];
    let fineRequests = [];
    const SUPER_ADMIN = { username: "superadmin", password: "super123" };
    let currentUser = null;
    let currentTab = "dashboard";
    let clickCount = 0, clickTimer = null;
    let chartInstance = null;
    
    function saveData() { localStorage.setItem("educatorData", JSON.stringify({ schools, admins, teachers, students, classesList, homeworks, events, fines, paymentInfo, chats, attendanceRecords, fineRequests })); }
    function loadData() {
        const saved = localStorage.getItem("educatorData");
        if (saved) { try { const d = JSON.parse(saved); schools = d.schools || schools; admins = d.admins || admins; teachers = d.teachers || teachers; students = d.students || students; classesList = d.classesList || classesList; homeworks = d.homeworks || homeworks; events = d.events || events; fines = d.fines || fines; paymentInfo = d.paymentInfo || paymentInfo; chats = d.chats || chats; attendanceRecords = d.attendanceRecords || attendanceRecords; fineRequests = d.fineRequests || fineRequests; } catch(e) {} }
        if(admins.length === 0) admins = [{ id: "admin1", username: "admin", password: "admin123", schoolId: "school1", name: "School Admin" }];
    }
    loadData();
    
    function showMessage(msg, isError = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isError ? 'error' : ''}`;
        msgDiv.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        const container = document.getElementById("mainContent");
        if(container) { container.insertBefore(msgDiv, container.firstChild); setTimeout(() => msgDiv.remove(), 3000); }
    }
    function renderScreen(html) { const container = document.getElementById("mainContent"); if(container) container.innerHTML = html; }
    function updateHeader() {
        const span = document.getElementById("userInfoDisplay");
        if(span) span.innerHTML = currentUser ? `<i class="fas fa-user-circle"></i> ${currentUser.type}: ${currentUser.name}` : `<i class="fas fa-user-circle"></i> Not Logged In`;
    }
    
    // Hidden Super Admin
    document.getElementById("logoClickArea")?.addEventListener("click", () => {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => clickCount = 0, 1000);
        if (clickCount === 5) {
            clickCount = 0;
            let pwd = prompt("Enter Super Admin Password:");
            if(pwd === SUPER_ADMIN.password) { currentUser = { type: "superadmin", name: "Super Admin" }; updateHeader(); renderSuperAdminPanel(); }
            else showMessage("Wrong password!", true);
        }
    });
    
    function renderSuperAdminPanel() {
        let html = `<div class="card"><div class="card-title"><i class="fas fa-globe"></i> Super Admin Panel</div><button id="logoutBtn" class="secondary btn-sm">Logout</button></div>
        <div class="card"><div class="card-title"><i class="fas fa-plus-circle"></i> Create New School</div><div class="flex-row"><input type="text" id="schoolName" placeholder="School Name"><input type="text" id="schoolCode" placeholder="Code"></div><button id="createSchoolBtn">Create School</button></div>
        <div class="card"><div class="card-title"><i class="fas fa-building"></i> All Schools</div>${schools.map(s => `<div class="item-card"><strong>${s.name}</strong> (${s.code})<button class="btn-sm delete-school" data-id="${s.id}" style="background:#ef4444;">Delete</button></div>`).join('')}</div>
        <div class="card"><div class="card-title"><i class="fas fa-user-shield"></i> Manage Admins</div>${admins.map(a => `<div class="item-card"><strong>${a.name}</strong><br>Username: ${a.username}<br>Password: ${a.password}<div class="flex-row"><button class="btn-sm edit-admin" data-id="${a.id}">Change Password</button><button class="btn-sm edit-admin-username" data-id="${a.id}">Change Username</button></div></div>`).join('')}</div>`;
        renderScreen(html);
        document.getElementById("logoutBtn")?.addEventListener("click", logout);
        document.getElementById("createSchoolBtn")?.addEventListener("click", () => {
            let name = document.getElementById("schoolName").value, code = document.getElementById("schoolCode").value;
            if(name && code) { let newId = Date.now()+""; schools.push({ id: newId, name, code }); admins.push({ id: Date.now()+"", username: "admin", password: "admin123", schoolId: newId, name: "School Admin" }); saveData(); renderSuperAdminPanel(); showMessage("School created!"); }
            else showMessage("Fill all", true);
        });
        document.querySelectorAll(".delete-school").forEach(btn => btn.addEventListener("click", (e) => { let id = btn.dataset.id; schools = schools.filter(s=>s.id!==id); admins = admins.filter(a=>a.schoolId!==id); teachers = teachers.filter(t=>t.schoolId!==id); students = students.filter(s=>s.schoolId!==id); classesList = classesList.filter(c=>c.schoolId!==id); homeworks = homeworks.filter(h=>h.schoolId!==id); saveData(); renderSuperAdminPanel(); showMessage("School deleted"); }));
        document.querySelectorAll(".edit-admin").forEach(btn => btn.addEventListener("click", (e) => { let id = btn.dataset.id, newPwd = prompt("Enter new password:"); if(newPwd) { let a = admins.find(a=>a.id===id); if(a) a.password = newPwd; saveData(); showMessage("Password changed!"); renderSuperAdminPanel(); } }));
        document.querySelectorAll(".edit-admin-username").forEach(btn => btn.addEventListener("click", (e) => { let id = btn.dataset.id, newUser = prompt("Enter new username:"); if(newUser) { let a = admins.find(a=>a.id===id); if(a) a.username = newUser; saveData(); showMessage("Username changed!"); renderSuperAdminPanel(); } }));
    }
    
    function renderLoginScreen() {
        let html = `<div class="card"><h3 style="text-align:center">Login to The Educator</h3><div class="role-buttons"><div class="role-btn" data-role="admin">🏫 Admin</div><div class="role-btn" data-role="teacher">👨‍🏫 Teacher</div><div class="role-btn" data-role="student">🎓 Student</div><div class="role-btn" data-role="parent">👪 Parent</div></div><div id="loginForm"></div></div>`;
        renderScreen(html);
        let selected = "admin";
        const roleBtns = document.querySelectorAll(".role-btn");
        roleBtns.forEach(btn => { btn.addEventListener("click", () => { roleBtns.forEach(b=>b.classList.remove("active")); btn.classList.add("active"); selected = btn.dataset.role; renderLoginForm(selected); }); });
        if(roleBtns[0]) roleBtns[0].classList.add("active");
        renderLoginForm("admin");
    }
    
    function renderLoginForm(role) {
        const container = document.getElementById("loginForm");
        if(!container) return;
        if(role === "admin") container.innerHTML = `<input type="text" id="adminUser" placeholder="Username"><input type="password" id="adminPass" placeholder="Password"><button id="loginAdminBtn">Login</button><p style="font-size:0.7rem;margin-top:8px;">Demo: admin / admin123</p>`;
        else if(role === "teacher") container.innerHTML = `<input type="email" id="teacherEmail" placeholder="Email"><input type="password" id="teacherPass" placeholder="Password"><button id="loginTeacherBtn">Login</button><p style="font-size:0.7rem;">teacher@demo.com / teacher123</p>`;
        else if(role === "student") container.innerHTML = `<input type="text" id="studentRoll" placeholder="Roll Number"><input type="password" id="studentPass" placeholder="Password"><button id="loginStudentBtn">Login</button><p style="font-size:0.7rem;">S101 / student123</p>`;
        else container.innerHTML = `<input type="text" id="parentRoll" placeholder="Child Roll Number"><button id="loginParentBtn">View as Parent</button><p style="font-size:0.7rem;">Enter S101 to see child data</p>`;
        
        document.getElementById("loginAdminBtn")?.addEventListener("click", () => { let user = admins.find(a=>a.username===document.getElementById("adminUser").value && a.password===document.getElementById("adminPass").value); if(user) { currentUser = { type: "admin", id: user.id, name: user.name, schoolId: user.schoolId }; updateHeader(); renderAdminPanel(); } else showMessage("Invalid", true); });
        document.getElementById("loginTeacherBtn")?.addEventListener("click", () => { let t = teachers.find(t=>t.email===document.getElementById("teacherEmail").value && t.password===document.getElementById("teacherPass").value); if(t) { currentUser = { type: "teacher", id: t.id, name: t.name, schoolId: t.schoolId }; updateHeader(); renderTeacherPanel(); } else showMessage("Invalid", true); });
        document.getElementById("loginStudentBtn")?.addEventListener("click", () => { let s = students.find(s=>s.rollNumber===document.getElementById("studentRoll").value && s.password===document.getElementById("studentPass").value); if(s) { currentUser = { type: "student", id: s.id, name: s.name, rollNumber: s.rollNumber, className: s.className, schoolId: s.schoolId }; updateHeader(); renderStudentPanel(); } else showMessage("Invalid", true); });
        document.getElementById("loginParentBtn")?.addEventListener("click", () => { let roll = document.getElementById("parentRoll").value; let s = students.find(s=>s.rollNumber===roll); if(s) { currentUser = { type: "parent", childId: s.id, childName: s.name, className: s.className, schoolId: s.schoolId }; updateHeader(); renderParentPanel(); } else showMessage("Roll number not found", true); });
    }
    
    // ======================== ADMIN PANEL ========================
    function renderAdminPanel() {
        const schoolStudents = students.filter(s=>s.schoolId===currentUser.schoolId);
        const schoolTeachers = teachers.filter(t=>t.schoolId===currentUser.schoolId);
        const schoolClasses = classesList.filter(c=>c.schoolId===currentUser.schoolId);
        const schoolHomeworks = homeworks.filter(h=>h.schoolId===currentUser.schoolId);
        const classStats = schoolClasses.map(c=>({ name: c.name, hwCount: schoolHomeworks.filter(h=>h.className===c.name).length }));
        const weakClass = classStats.length ? classStats.sort((a,b)=>a.hwCount-b.hwCount)[0] : { name:'N/A', hwCount:0 };
        const topClass = classStats.length ? classStats.sort((a,b)=>b.hwCount-a.hwCount)[0] : { name:'N/A', hwCount:0 };
        
        let html = `<div class="card"><div class="card-title"><i class="fas fa-school"></i> Admin: ${admins.find(a=>a.id===currentUser.id)?.name}</div><div class="flex-row"><button id="changeAdminUsername" class="secondary btn-sm">Change Username</button><button id="changeAdminPwd" class="secondary btn-sm">Change Password</button><button id="logoutBtn" class="secondary btn-sm">Logout</button></div></div>
        <div class="nav-tabs"><div class="nav-tab" data-tab="dashboard"><i class="fas fa-chart-line"></i> Dashboard</div><div class="nav-tab" data-tab="teachers"><i class="fas fa-chalkboard-user"></i> Teachers</div><div class="nav-tab" data-tab="students"><i class="fas fa-user-graduate"></i> Students</div><div class="nav-tab" data-tab="classes"><i class="fas fa-building"></i> Classes</div><div class="nav-tab" data-tab="events"><i class="fas fa-calendar"></i> Events</div><div class="nav-tab" data-tab="fines"><i class="fas fa-money-bill"></i> Fines</div><div class="nav-tab" data-tab="chat"><i class="fas fa-comments"></i> Chat</div></div><div id="tabContent"></div>`;
        renderScreen(html);
        
        document.getElementById("logoutBtn")?.addEventListener("click", logout);
        document.getElementById("changeAdminUsername")?.addEventListener("click", () => { let nu=prompt("New username:"); if(nu){ let a=admins.find(a=>a.id===currentUser.id); if(a) a.username=nu; saveData(); showMessage("Username changed!"); renderAdminPanel(); } });
        document.getElementById("changeAdminPwd")?.addEventListener("click", () => { let np=prompt("New password:"); if(np){ let a=admins.find(a=>a.id===currentUser.id); if(a) a.password=np; saveData(); showMessage("Password changed!"); } });
        
        document.querySelectorAll(".nav-tab").forEach(tab => { tab.addEventListener("click", () => { currentTab = tab.dataset.tab; renderAdminTab(); }); });
        currentTab = "dashboard";
        renderAdminTab();
        
        function renderAdminTab() {
            const container = document.getElementById("tabContent");
            if(!container) return;
            const schoolStudents = students.filter(s=>s.schoolId===currentUser.schoolId);
            const schoolTeachers = teachers.filter(t=>t.schoolId===currentUser.schoolId);
            const schoolClasses = classesList.filter(c=>c.schoolId===currentUser.schoolId);
            const schoolHomeworks = homeworks.filter(h=>h.schoolId===currentUser.schoolId);
            
            if(currentTab === "dashboard") {
                const classStats = schoolClasses.map(c=>({ name:c.name, hwCount: schoolHomeworks.filter(h=>h.className===c.name).length }));
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-chart-line"></i> Analytics</div><div class="stats-grid"><div class="stat-card"><div class="stat-number">${schoolStudents.length}</div><div>Students</div></div><div class="stat-card"><div class="stat-number">${schoolTeachers.length}</div><div>Teachers</div></div><div class="stat-card"><div class="stat-number">${schoolClasses.length}</div><div>Classes</div></div><div class="stat-card"><div class="stat-number">${schoolHomeworks.length}</div><div>Homework</div></div></div><canvas id="adminChart" style="margin-top:10px; max-height:180px;"></canvas></div>`;
                const ctx = document.getElementById("adminChart")?.getContext('2d');
                if(ctx && chartInstance) chartInstance.destroy();
                if(ctx) chartInstance = new Chart(ctx, { type:'bar', data:{ labels:classStats.map(c=>c.name), datasets:[{ label:'Homework', data:classStats.map(c=>c.hwCount), backgroundColor:'#3b82f6', borderRadius:8 }] } });
            }
            else if(currentTab === "teachers") {

    // ======================== TEACHER PANEL ========================
    function renderTeacherPanel() {
        let myClasses = [...new Set(students.filter(s=>s.schoolId===currentUser.schoolId).map(s=>s.className))];
        let html = `<div class="card"><div class="card-title"><i class="fas fa-chalkboard-user"></i> Teacher: ${currentUser.name}</div><button id="changeTeacherPwd" class="secondary btn-sm">Change Password</button><button id="logoutBtn" class="secondary btn-sm">Logout</button></div>
        <div class="nav-tabs"><div class="nav-tab" data-tab="attendance"><i class="fas fa-check-circle"></i> Attendance</div><div class="nav-tab" data-tab="homework"><i class="fas fa-book"></i> Homework</div><div class="nav-tab" data-tab="chat"><i class="fas fa-comments"></i> Chat</div></div><div id="teacherTabContent"></div>`;
        renderScreen(html);
        document.getElementById("logoutBtn")?.addEventListener("click", logout);
        document.getElementById("changeTeacherPwd")?.addEventListener("click", () => { let np=prompt("New password:"); if(np){ let t=teachers.find(t=>t.id===currentUser.id); if(t) t.password=np; saveData(); showMessage("Password changed!"); } });
        
        function renderTeacherTab(tab) {
            const container = document.getElementById("teacherTabContent");
            if(!container) return;
            if(tab === "attendance") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-calendar-check"></i> Mark Attendance</div><select id="attClass">${myClasses.map(c=>`<option>${c}</option>`)}</select><input type="date" id="attDate" value="${new Date().toISOString().split('T')[0]}"><div id="attendanceStudents"></div><button id="saveAttendanceBtn">Save Attendance</button></div>`;
                function loadAttendanceList() {
                    let cls = document.getElementById("attClass").value;
                    let classStudents = students.filter(s=>s.className===cls && s.schoolId===currentUser.schoolId);
                    let html = `<table class="attendance-table"><tr><th>Student</th><th>P</th><th>A</th></tr>` + classStudents.map(s => `<tr><td>${s.name}</td><td><button class="btn-sm att-p" data-id="${s.id}" style="background:#10b981">P</button></td><td><button class="btn-sm att-a" data-id="${s.id}" style="background:#ef4444">A</button></td></tr>`).join('') + `</table>`;
                    document.getElementById("attendanceStudents").innerHTML = html;
                    document.querySelectorAll(".att-p").forEach(btn => btn.addEventListener("click", () => { btn.style.background="#10b981"; btn.parentElement.nextElementSibling.querySelector(".att-a").style.background="#ef4444"; }));
                    document.querySelectorAll(".att-a").forEach(btn => btn.addEventListener("click", () => { btn.style.background="#ef4444"; btn.parentElement.previousElementSibling.querySelector(".att-p").style.background="#d1d5db"; }));
                }
                document.getElementById("attClass")?.addEventListener("change", loadAttendanceList);
                document.getElementById("saveAttendanceBtn")?.addEventListener("click", () => {
                    let cls = document.getElementById("attClass").value;
                    let date = document.getElementById("attDate").value;

                    let pButtons = document.querySelectorAll(".att-p");
                    classStudents.forEach((s, idx) => {
                        let isPresent = pButtons[idx]?.style.background === "rgb(16, 185, 129)";
                        attendanceRecords.push({ studentId: s.id, date, status: isPresent?"present":"absent", classId: cls, schoolId: currentUser.schoolId });
                    });
                    saveData();
                    showMessage("Attendance saved!");
                    renderTeacherTab("attendance");
                });
                loadAttendanceList();
            }
            else if(tab === "homework") {
                let myHomeworks = homeworks.filter(h=>h.teacherId===currentUser.id);
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-plus"></i> Add Homework</div><select id="hwClass">${myClasses.map(c=>`<option>${c}</option>`)}</select><input id="hwSubj" placeholder="Subject"><textarea id="hwDesc" rows="2" placeholder="Description"></textarea><input id="hwDue" type="date"><button id="addHwBtn">Publish</button></div>
                <div class="card"><div class="card-title"><i class="fas fa-tasks"></i> My Homework</div>${myHomeworks.map(h=>`<div class="item-card"><strong>${h.subject}</strong> - ${h.className}<br>${h.description}<br><span class="badge">Due: ${h.dueDate}</span><button class="btn-sm edit-hw" data-id="${h.id}">Edit</button><button class="btn-sm delete-hw" data-id="${h.id}" style="background:#ef4444;">Delete</button></div>`).join('')}</div>`;
                document.getElementById("addHwBtn")?.addEventListener("click", () => { let cls=document.getElementById("hwClass").value, subj=document.getElementById("hwSubj").value, desc=document.getElementById("hwDesc").value, due=document.getElementById("hwDue").value; if(cls&&subj&&desc) { homeworks.push({ id:Date.now()+"", className:cls, subject:subj, description:desc, dueDate:due, teacherId:currentUser.id, schoolId:currentUser.schoolId, completedBy:[] }); saveData(); showMessage("Homework added!"); renderTeacherTab("homework"); } });
                document.querySelectorAll(".delete-hw").forEach(btn => btn.addEventListener("click", (e) => { let id=btn.dataset.id; homeworks=homeworks.filter(h=>h.id!==id); saveData(); renderTeacherTab("homework"); showMessage("Deleted!"); }));
                document.querySelectorAll(".edit-hw").forEach(btn => btn.addEventListener("click", (e) => { let id=btn.dataset.id; let hw=homeworks.find(h=>h.id===id); if(hw) { let newDesc=prompt("Edit description:", hw.description); if(newDesc) { hw.description=newDesc; saveData(); renderTeacherTab("homework"); showMessage("Updated!"); } } }));
            }
            else if(tab === "chat") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-comments"></i> Educator Chat</div><select id="chatTarget"><option value="admin">Admin</option><option value="parents">Parents</option>${students.filter(s=>s.schoolId===currentUser.schoolId).map(s=>`<option value="student_${s.id}">Student: ${s.name}</option>`)}</select><textarea id="chatMsg" rows="2" placeholder="Message..."></textarea><button id="sendChatBtn">Send</button><div id="chatList">${chats.filter(c=>c.schoolId===currentUser.schoolId && (c.from===currentUser.name || c.to===currentUser.name)).slice(-8).reverse().map(c=>`<div class="item-card">${c.from}: ${c.message}</div>`).join('')}</div></div>`;
                document.getElementById("sendChatBtn")?.addEventListener("click", () => { let msg=document.getElementById("chatMsg").value, target=document.getElementById("chatTarget").value; if(msg) { chats.push({ from:currentUser.name, to:target, message:msg, timestamp:Date.now(), schoolId:currentUser.schoolId }); saveData(); showMessage("Sent!"); renderTeacherTab("chat"); } });
            }
        }
        document.querySelectorAll(".nav-tab").forEach(tab => { tab.addEventListener("click", () => { document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active")); tab.classList.add("active"); renderTeacherTab(tab.dataset.tab); }); });
        document.querySelector(".nav-tab")?.classList.add("active");
        renderTeacherTab("attendance");
    }
    
    // ======================== STUDENT PANEL ========================
    function renderStudentPanel() {
        let student = students.find(s=>s.id===currentUser.id);
        let myHomeworks = homeworks.filter(h=>h.className===currentUser.className && h.schoolId===currentUser.schoolId);
        let myAttendance = attendanceRecords.filter(a=>a.studentId===currentUser.id);
        let presentCount = myAttendance.filter(a=>a.status==="present").length;
        let percent = myAttendance.length ? (presentCount/myAttendance.length*100).toFixed(1) : 0;
        let myFines = fines.filter(f=>f.studentId===currentUser.id);
        let schoolEvents = events.filter(e=>e.schoolId===currentUser.schoolId);
        let tasks = student?.tasks || [];
        
        let html = `<div class="card"><div class="card-title"><i class="fas fa-user-graduate"></i> Student: ${currentUser.name}</div><button id="changeStudentPwd" class="secondary btn-sm">Change Password</button><button id="logoutBtn" class="secondary btn-sm">Logout</button></div>
        <div class="nav-tabs"><div class="nav-tab" data-tab="tasks"><i class="fas fa-tasks"></i> Tasks</div><div class="nav-tab" data-tab="homework"><i class="fas fa-book"></i> Homework</div><div class="nav-tab" data-tab="attendance"><i class="fas fa-calendar-check"></i> Attendance</div><div class="nav-tab" data-tab="fines"><i class="fas fa-money-bill"></i> Fines</div><div class="nav-tab" data-tab="events"><i class="fas fa-calendar"></i> Events</div><div class="nav-tab" data-tab="chat"><i class="fas fa-comments"></i> Chat</div></div><div id="studentTabContent"></div>`;
        renderScreen(html);
        document.getElementById("logoutBtn")?.addEventListener("click", logout);
        document.getElementById("changeStudentPwd")?.addEventListener("click", () => { let np=prompt("New password:"); if(np){ let s=students.find(s=>s.id===currentUser.id); if(s) s.password=np; saveData(); showMessage("Password changed!"); } });
        
        function renderStudentTab(tab) {
            const container = document.getElementById("studentTabContent");
            if(!container) return;
            if(tab === "tasks") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-tasks"></i> My Daily Tasks</div><div id="taskList">${tasks.map((t,idx)=>`<div class="task-item"><input type="checkbox" class="task-check" data-idx="${idx}" ${t.done?'checked':''}><span class="${t.done?'task-done':''}">${t.time ? t.time+' - ' : ''}${t.text}</span><button class="btn-sm delete-task" data-idx="${idx}" style="background:#ef4444;">Del</button></div>`).join('')}</div><div class="flex-row"><input type="time" id="taskTime" style="width:100px"><input type="text" id="newTask" placeholder="Task..." style="flex:1"><button id="addTaskBtn" class="btn-sm">Add</button></div></div>`;
                document.getElementById("addTaskBtn")?.addEventListener("click", () => { let text=document.getElementById("newTask").value, time=document.getElementById("taskTime").value; if(text && student) { student.tasks.push({ text, time, done:false }); saveData(); renderStudentTab("tasks"); } });
                document.querySelectorAll(".task-check").forEach(cb => cb.addEventListener("change", (e) => { if(student) { student.tasks[e.target.dataset.idx].done=e.target.checked; saveData(); } }));
                document.querySelectorAll(".delete-task").forEach(btn => btn.addEventListener("click", (e) => { if(student) { student.tasks.splice(e.target.dataset.idx,1); saveData(); renderStudentTab("tasks"); } }));
            }
            else if(tab === "homework") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-book"></i> My Homework</div>${myHomeworks.map(h=>`<div class="item-card"><strong>${h.subject}</strong><br>${h.description}<br><span class="badge">Due: ${h.dueDate}</span>${!h.completedBy.includes(currentUser.id)?`<button class="btn-sm complete-hw" data-id="${h.id}" style="background:#10b981">✓ Mark Done</button>`:`<span class="badge-success">✓ Completed</span>`}</div>`).join('')}</div>`;
                document.querySelectorAll(".complete-hw").forEach(btn => btn.addEventListener("click", (e) => { let id=btn.dataset.id; let hw=homeworks.find(h=>h.id===id); if(hw && !hw.completedBy.includes(currentUser.id)) { hw.completedBy.push(currentUser.id); saveData(); renderStudentTab("homework"); showMessage("Homework completed! Great job! 🎉"); } }));
            }
            else if(tab === "attendance") {
                let warning = percent < 70 ? `<div class="badge-danger" style="padding:10px; border-radius:16px; margin-top:10px;">⚠️ Warning: Attendance below 70%! Fine may apply.</div>` : "";
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-chart-line"></i> My Attendance</div><div class="stat-card"><div class="stat-number">${percent}%</div><div>Attendance Rate</div></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(percent,100)}%"></div></div><div>Present: ${presentCount} | Total: ${myAttendance.length}</div>${warning}</div>`;
            }
            else if(tab === "fines") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-money-bill"></i> My Fines</div>${myFines.map(f=>`<div class="item-card">Rs ${f.amount} - ${f.reason} ${f.paid ? '<span class="badge-success">✅ Paid</span>' : '<span class="badge-warning">❌ Unpaid</span>'}</div>`).join('')}<div class="card"><strong>Payment Methods:</strong><br>💳 JazzCash: ${paymentInfo.jazzcash}<br>💳 EasyPaisa: ${paymentInfo.easypaisa}<br>🏦 Bank: ${paymentInfo.bank}</div>`;
            }
            else if(tab === "events") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-calendar-alt"></i> Upcoming Events</div>${schoolEvents.map(e=>`<div class="item-card">📅 ${e.title} - ${e.date} (${e.type})</div>`).join('')}</div>`;
            }
            else if(tab === "chat") {
                container.innerHTML = `<div class="card"><div class="card-title"><i class="fas fa-comments"></i> Educator Chat</div><select id="chatTarget"><option value="teacher">Teacher</option></select><textarea id="chatMsg" rows="2" placeholder="Message..."></textarea><button id="sendChatBtn">Send</button><div id="chatList">${chats.filter(c=>c.schoolId===currentUser.schoolId && (c.from===currentUser.name || c.to===currentUser.name)).slice(-8).reverse().map(c=>`<div class="item-card">${c.from}: ${c.message}</div>`).join('')}</div></div>`;
                document.getElementById("sendChatBtn")?.addEventListener("click", () => { let msg=document.getElementById("chatMsg").value; if(msg) { chats.push({ from:currentUser.name, to:"Teacher", message:msg, timestamp:Date.now(), schoolId:currentUser.schoolId }); saveData(); showMessage("Sent!"); renderStudentTab("chat"); } });
            }
        }
        document.querySelectorAll(".nav-tab").forEach(tab => { tab.addEventListener("click", () => { document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active")); tab.classList.add("active"); renderStudentTab(tab.dataset.tab); }); });
        document.querySelector(".nav-tab")?.classList.add("active");
        renderStudentTab("tasks");
    }
    
    // ======================== PARENT PANEL ========================

        let myFines = fines.filter(f=>f.studentId===currentUser.childId);

            if(!container) return;
            if(tab === "homework") container.innerHTML = `<div class="card">${myHomeworks.map(h=>`<div class="item-card"><strong>${h.subject}</strong><br>${h.description}<br><span class="badge">Due: ${h.dueDate}</span></div>`).join('')}</div>`;
            else if(tab === "attendance") {
                let myAttendance = attendanceRecords.filter(a=>a.studentId===currentUser.childId);
                let presentCount = myAttendance.filter(a=>a.status==="present").length;
                let percent = myAttendance.length ? (presentCount/myAttendance.length*100).toFixed(1) : 0;
                container.innerHTML = `<div class="card"><div class="stat-card"><div class="stat-number">${percent}%</div><div>Attendance Rate</div></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(percent,100)}%"></div></div></div>`;
            }
            else if(tab === "fines") container.innerHTML = `<div class="card">${myFines.map(f=>`<div class="item-card">Rs ${f.amount} - ${f.reason} ${f.paid ? '✅ Paid' : '❌ Unpaid'}</div>`).join('')}<div><strong>Pay via:</strong><br>JazzCash: ${paymentInfo.jazzcash}<br>EasyPaisa: ${paymentInfo.easypaisa}<br>Bank: ${paymentInfo.bank}</div></div>`;
            else if(tab === "events") container.innerHTML = `<div class="card">${schoolEvents.map(e=>`<div class="item-card">📅 ${e.title} - ${e.date}</div>`).join('')}</div>`;
            else if(tab === "chat") container.innerHTML = `<div class="card"><select id="chatTarget"><option value="">Select Teacher</option>${teachersList.map(t=>`<option value="teacher_${t.id}">${t.name}</option>`)}</select><textarea id="chatMsg" rows="2" placeholder="Message..."></textarea><button id="sendChatBtn">Send</button><div id="chatList">${chats.filter(c=>c.schoolId===currentUser.schoolId && (c.from.includes("Parent") || c.to.includes("Parent"))).slice(-5).reverse().map(c=>`<div class="item-card">${c.from}: ${c.message}</div>`).join('')}</div></div>`;
            document.getElementById("sendChatBtn")?.addEventListener("click", () => { let msg=document.getElementById("chatMsg").value, target=document.getElementById("chatTarget").value; if(msg) { chats.push({ from:"Parent of "+currentUser.childName, to:target, message:msg, timestamp:Date.now(), schoolId:currentUser.schoolId }); saveData(); showMessage("Sent!"); renderParentTab("chat"); } });
        }
        document.querySelectorAll(".nav-tab").forEach(tab => { tab.addEventListener("click", () => { document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("active")); tab.classList.add("active"); renderParentTab(tab.dataset.tab); }); });
        document.querySelector(".nav-tab")?.classList.add("active");
        renderParentTab("homework");
    }
    
    function logout() { currentUser = null; updateHeader(); renderLoginScreen(); }
    renderLoginScreen();
</script>
</body>
</html>
